name: Tardemah CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tardemah:tardemah@localhost:5432/tardemah
      DATABASE_URL_UNPOOLED: postgresql://tardemah:tardemah@localhost:5432/tardemah
      NEON_AUTH_BASE_URL: https://auth-ci.invalid
      NEON_AUTH_COOKIE_SECRET: tardemah-ci-cookie-secret-at-least-32-characters-long
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install pnpm
        run: npm install --global pnpm@10.17.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate database schema
        run: pnpm db:validate

      - name: Type-check mobile
        run: pnpm --filter @tardemah/mobile exec tsc --noEmit

      - name: Type-check web
        run: pnpm --filter @tardemah/web exec tsc --noEmit

      - name: Build web
        run: pnpm build:web
