name: Maintain pnpm lockfile

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - ".github/workflows/lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install pnpm
        run: npm install --global pnpm@10.17.0

      - name: Generate lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "pnpm-lock.yaml is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm lockfile"
          git push
