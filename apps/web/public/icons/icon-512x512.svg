<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#241e34"/>
      <stop offset="60%" stop-color="#14111d"/>
      <stop offset="100%" stop-color="#0b0a10"/>
    </radialGradient>
    <linearGradient id="crescent" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fdf8f0"/>
      <stop offset="50%" stop-color="#f1dfcc"/>
      <stop offset="100%" stop-color="#d6b598"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle inner border ring -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#68567f" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Nocturnal Crescent Moon -->
  <path d="M220 130 A130 130 0 1 0 360 290 A105 105 0 0 1 220 130 Z" fill="url(#crescent)" filter="url(#glow)"/>

  <!-- Tactile Journal Bookmark Ribbon / Stylus -->
  <path d="M335 155 L375 155 L375 320 L355 300 L335 320 Z" fill="#b99370" opacity="0.92"/>

  <!-- Compass / Waypoint Star Marker at Zenith -->
  <circle cx="355" cy="180" r="4" fill="#fdf8f0"/>
</svg>
